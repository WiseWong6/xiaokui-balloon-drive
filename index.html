<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小葵 · 把气球交给风</title>
<link rel="stylesheet" href="style.css">
<script defer src="vendor/p5.min.js"></script>
<script defer src="xiaokui-car.js"></script>
<script defer src="scene.js"></script>
</head>
<body>
<main>
  <header><span>小葵 · 把气球交给风</span><a href="xiaokui-car-arm-trimmed.png" target="_blank" rel="noopener">造型稿 ↗</a></header>
  <div id="stage" role="img" aria-label="纯蓝空间里，灰白小猫小葵驾驶白色敞篷车匀速向右行驶，镜头持续跟随，整车始终在画面内；车尾的二十八只彩色气球向后倾斜，逐个松开，随风向左上方飘走。"></div>
  <footer>
    <div class="buttons"><button id="play" aria-label="暂停动画">暂停</button><button id="restart">重播</button><span id="phase" aria-live="off">带着气球兜风</span></div>
    <div class="timeline"><input id="seek" type="range" min="0" max="18" step="0.01" value="0" aria-label="动画进度"><output id="time">00:00 / 00:18</output></div>
  </footer>
</main>
<noscript>请启用 JavaScript 以播放动画。</noscript>
</body>
</html>
